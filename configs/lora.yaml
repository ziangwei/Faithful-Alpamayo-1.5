model:
  model_id: nvidia/Alpamayo-1.5-10B
  dtype: bfloat16

lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  auto_discover_linear_layers: true
  preferred_target_name_patterns:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  freeze_base_model: true
  save_full_model: false

training:
  method: lora_text
  max_epochs: 2
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.0
  bf16: true
  validate_every_steps: 100
  select_best_by: reasoning_action_consistency_rate

data:
  train_manifest: data/manifests/manifest_300clips.jsonl
  correction_jsonl: data/annotations/coc_corrections.jsonl

outputs:
  adapter_dir: adapters/lora
  checkpoint_dir: checkpoints/lora
  train_log_jsonl: logs/lora/train_log.jsonl
  best_config_yaml: adapters/lora/best_config.yaml
